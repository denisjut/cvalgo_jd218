[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "denisjut-cvalgo_jd218"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别计算机视觉算法工程师·显存碎片与分配策略上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "denisjut" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://denisjut.github.io"
Repository = "https://github.com/denisjut/cvalgo_jd218"
Issues = "https://github.com/denisjut/cvalgo_jd218/issues"

[project.scripts]
cvalgo_jd218 = "cvalgo_jd218:main"

[tool.setuptools]
py-modules = ["cvalgo_jd218"]
